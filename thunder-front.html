function joinClient(){if(N.dead)return;const pk=new window.Peer();N.pk=pk;let ok=false;setTimeout(()=>{if(!ok&&!N.dead&&N.pk===pk)retry()},7000);
pk.on('open',id=>{N.me=id;const c=pk.connect(HID,{reliable:false});N.up=c;c.on('open',()=>{ok=true;N.status='online';c.send({t:'p',p:N.myP})});c.on('data',d=>{if(d&&d.t=='s'){N.peers={};for(const q of d.l)N.peers[q[0]]=q[1];emit()}});c.on('close',()=>{if(N.pk===pk)retry()});c.on('error',()=>{})});pk.on('error',()=>{if(N.pk===pk)retry()})}
function begin(){if(N.dead)return;const pk=new window.Peer(HID);N.pk=pk;
pk.on('open',id=>{N.hub=true;N.me=id;N.status='online';N.peers[id]=N.myP;dirty=true});
pk.on('connection',c=>{c.on('open',()=>{N.conns[c.peer]=c});c.on('data',d=>{if(d&&d.t=='p'){N.peers[c.peer]=Object.assign(N.peers[c.peer]||{},d.p);dirty=true}});c.on('close',()=>{delete N.conns[c.peer];delete N.peers[c.peer];dirty=true});c.on('error',()=>{})});
pk.on('error',er=>{if(er&&er.type=='unavailable-id'){try{pk.destroy()}catch(e){}joinClient()}else if(N.pk===pk)retry()})}
begin();
return{get status(){return N.status},presence:p=>{Object.assign(N.myP,p);if(N.hub)dirty=true;else if(N.up&&N.up.open)try{N.up.send({t:'p',p})}catch(e){}return Promise.resolve()},onPeers:fn=>{N.cb=fn;if(N.status=='online')emit()},join:n=>Promise.resolve(mkNet(room+'-'+n)),leave:()=>{N.dead=true;clearInterval(iv);try{N.pk&&N.pk.destroy()}catch(e){}return Promise.resolve()}}}
async function netInit(){$('nm').value=myName;try{const sn=localStorage.getItem('tf_name');if(sn){myName=sn;$('nm').value=sn}}catch(e){}$('nm').onchange=()=>{myName=$('nm').value.trim().slice(0,16)||myName;try{localStorage.setItem('tf_name',myName)}catch(e){}setPres()};olUI();
const cl=window.claude&&window.claude.use?window.claude:null;
if(cl){try{const u=await cl.use('user');if(u&&u.me&&!localStorage.getItem('tf_name')){const m=await u.me();if(m&&m.name){myName=String(m.name).slice(0,16);$('nm').value=myName}}}catch(e){}try{lob=await cl.use('room')}catch(e){lob=null}}
if(!lob){try{await loadPeer();lob=mkNet('lobby')}catch(e){lob=null}}
if(!lob){olUI();return}
lob.onPeers(c=>{lpeers=c.peers;const m=c.peers.find(p=>p.isMe&&p.sameTab);if(m)myPeer=m.peer;olUI()});setPres();olUI();

function findV(n){for(const c in ROS){const v=ROS[c].find(q=>q.n==n);if(v)return[v,c]}return null}
function rmRem(k){const e=remotes[k];if(!e)return;scene.remove(e.g);dispo(e.g);const i=A.indexOf(e);if(i>=0)A.splice(i,1);delete remotes[k]}
function syncRemotes(ps){if(!OL||!scene)return;const seen={};for(const p of ps){const pv=p.presence;if(p.isMe||p.kind!='viewer'||!pv.v)continue;seen[p.peer]=1;let e=remotes[p.peer];
if(!e||e.vn!=pv.v){if(e)rmRem(p.peer);const f=findV(pv.v);if(!f)continue;e=ent(f[0],2,f[1]);e.rem=true;e.peer=p.peer;e.pn=String(pv.n||'Pilot').slice(0,16);e.vn=pv.v;e.g.visible=false;remotes[p.peer]=e;seenD[p.peer]=pv.d||0;seenDm[p.peer]=((pv.dm||{})[myPeer])||0;seenFc[p.peer]=pv.fc||0}
e.pn=String(pv.n||'Pilot').slice(0,16);e.pres=pv}for(const k of Object.keys(remotes))if(!seen[k])rmRem(k)}
function nameOf(pr){return pr==myPeer?myName:(remotes[pr]&&remotes[pr].pn)||'someone'}
function cosB(e,k){const c=e.cls,air=c=='air'||c=='heli';const d=air?fw(e.yaw,c=='heli'?e.fp:e.pitch):fw(e.yaw+e.tur,e.aim.p),o=e.g.position.clone().addScaledVector(d,air?8:6);if(!air)o.y+=e.oy+1;const sh=k=='s'||k=='b',m=k=='r'?mkFlight():k=='b'?mkBomb():new T.Mesh(sh?sG:gG,k=='s'?mK:mY);scene.add(m);Bl.push({m,tr:k=='r'?1:0,p:o,v:d.multiplyScalar(k=='r'?450:k=='b'?Math.max(1,e.spd):air?900:e.bs),g:k=='s'||k=='b'?9.8:0,life:k=='s'?6:k=='b'?15:2,own:e,team:2,d:0,cos:1})}
function rupd(e,dt){const p=e.pres;if(!p||!p.p)return;const a=p.p,q=e.g.position,k=Math.min(1,dt*10);q.x+=(a[0]-q.x)*k;q.y+=(a[1]-q.y)*k;q.z+=(a[2]-q.z)*k;e.yaw+=wrap(a[3]-e.yaw)*k;e.pitch+=(a[4]-e.pitch)*k;e.roll+=(a[5]-e.roll)*k;e.g.rotation.set(e.pitch,e.yaw,e.roll);e.tur+=wrap((a[6]||0)-e.tur)*k;e.aim.p=a[7]||0;e.spd=a[8]||0;e.thr=.9;
const u=e.g.userData;if(u.t){u.t.forEach(t=>t.rotation.y=e.tur);u.gn.forEach(g=>g.rotation.x=-e.aim.p)}
if(p.hp!=null){e.hp=p.hp;e.g.visible=p.hp>0&&p.al!=0}
if((p.d||0)>(seenD[e.peer]||0)){seenD[e.peer]=p.d;kf.unshift({a:nameOf(p.by),b:e.pn,w:p.bw||'?',at:p.by==myPeer?0:1,t:7});if(kf.length>6)kf.pop();if(p.by==myPeer)kills++;boom(q,e.r*1.3)}
const dm=((p.dm||{})[myPeer])||0;if(dm>(seenDm[e.peer]||0)){const d=dm-(seenDm[e.peer]||0);seenDm[e.peer]=dm;if(P.hp>0)hurt(P,d,e,p.dw||'guns')}
if((p.fc||0)>(seenFc[e.peer]||0)){const n=Math.min(3,p.fc-seenFc[e.peer]);seenFc[e.peer]=p.fc;for(let i=0;i<n;i++)cosB(e,p.fk)}}
function hitE(e,d,src,w){if(e.rem){if(d>0){myDm[e.peer]=(myDm[e.peer]||0)+Math.round(d);myDw=w||'guns'}}else hurt(e,d,src,w)}
function netSend(t){if(!OL||!orm||!P||t-lastSent<66)return;lastSent=t;const q=P.g.position;orm.presence({p:[r1(q.x),r1(q.y),r1(q.z),r2(P.yaw),r2(P.pitch),r2(P.roll),r2(P.tur),r2(P.aim.p),Math.round(P.spd)],hp:Math.round(P.hp),al:P.hp>0?1:0,fc:myFc,fk:myFk,dm:myDm,dw:myDw,d:myD,by:myBy,bw:myBw}).catch(()=>{})}
async function joinArena(){myDm={};myD=0;myBy='';myBw='';myFc=0;remotes={};seenD={};seenDm={};seenFc={};setPres();try{const rm=await lob.join('arena');if(!OL){rm.leave();return}orm=rm;rm.onPeers(c=>{const m=c.peers.find(p=>p.isMe&&p.sameTab);if(m)myPeer=m.peer;syncRemotes(c.peers)});const v=ROS[cls][sel];rm.presence({n:myName,c:cls,v:v.n,br:v.br}).catch(()=>{})}catch(e){flash='Could not join the arena.'}}
function leaveOnline(){const was=OL;OL=false;if(orm){orm.leave().catch(()=>{});orm=null}if(scene)for(const k of Object.keys(remotes))rmRem(k);remotes={};if(was)setPres()}
$('onb').onclick=()=>{if(!lob||(lob.status&&lob.status!='online')){flash=lob?'Still connecting to the online server - try again in a few seconds.':'Online is unavailable right now (no connection).';menu();return}flash='';leaveOnline();OL=true;start();joinArena()};
